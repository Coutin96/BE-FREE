<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine - Minha Loja Virtual</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        /* Filtro */
        .filtro-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            background: #fafafa;
            padding: 15px 20px;
            border-radius: 12px;
        }

        .filtro-area label {
            font-weight: 600;
            color: #2c3e50;
            font-size: 15px;
        }

        .filtro-area select {
            padding: 10px 18px;
            border: 2px solid #ddd;
            border-radius: 30px;
            font-size: 15px;
            background: #fff;
            cursor: pointer;
            outline: none;
            min-width: 180px;
            transition: 0.3s;
        }

        .filtro-area select:hover,
        .filtro-area select:focus {
            border-color: #2c3e50;
        }

        /* Grid de produtos */
        .vitrine-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 30px;
        }

        .vitrine-card {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: 0.3s;
            border: 1px solid #eee;
            display: flex;
            flex-direction: column;
        }

        .vitrine-card:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .vitrine-card .foto {
            width: 100%;
            height: 220px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .vitrine-card .foto img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .vitrine-card .info {
            padding: 18px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .vitrine-card .info .codigo {
            font-size: 12px;
            color: #888;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .vitrine-card .info .colecao {
            font-size: 14px;
            color: #2c3e50;
            font-weight: 600;
            background: #ecf0f1;
            padding: 2px 12px;
            border-radius: 20px;
            display: inline-block;
            align-self: flex-start;
        }

        .vitrine-card .info .preco {
            font-size: 24px;
            font-weight: 700;
            color: #27ae60;
            margin: 5px 0;
        }

        .vitrine-card .info .status {
            font-size: 13px;
            font-weight: 600;
            color: #e74c3c;
            background: #fde8e8;
            padding: 2px 12px;
            border-radius: 20px;
            display: inline-block;
            align-self: flex-start;
        }

        .vitrine-card .info .fornecedor {
            font-size: 13px;
            color: #555;
            border-top: 1px solid #eee;
            padding-top: 10px;
            margin-top: 5px;
        }

        .vitrine-card .info .fornecedor span {
            display: block;
        }

        .vitrine-card .info .link-foto {
            font-size: 12px;
            color: #3498db;
            word-break: break-all;
            margin-top: 5px;
        }

        .sem-produtos {
            text-align: center;
            color: #999;
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .filtro-area {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🛍️ Minha Loja Virtual - Vitrine</h1>

        <!-- Filtro por coleção -->
        <div class="filtro-area">
            <label for="filtro-colecao">🔍 Filtrar por coleção:</label>
            <select id="filtro-colecao">
                <option value="">-- Todas as coleções --</option>
            </select>
        </div>

        <div id="vitrine" class="vitrine-grid"></div>
        <p id="sem-produtos" class="sem-produtos" style="display:none;">Nenhum produto disponível para esta coleção.</p>
    </div>

    <script>
        (function () {
            const STORAGE_KEY_PRODUTOS = 'loja_produtos';

            function getProdutos() {
                return JSON.parse(localStorage.getItem(STORAGE_KEY_PRODUTOS)) || [];
            }

            function formatMoney(value) {
                return 'R$ ' + value.toFixed(2).replace('.', ',');
            }

            function getDriveImageUrl(link) {
                if (!link) return '';
                let id = null;
                const match1 = link.match(/\/file\/d\/([^/]+)/);
                if (match1) id = match1[1];
                const match2 = link.match(/[?&]id=([^&]+)/);
                if (match2) id = match2[1];
                if (id) {
                    return `https://drive.google.com/uc?export=view&id=${id}`;
                }
                return link;
            }

            // Preenche o dropdown com as coleções únicas dos produtos disponíveis
            function popularFiltro(produtos) {
                const select = document.getElementById('filtro-colecao');
                // Obtém coleções únicas (apenas dos produtos disponíveis)
                const colecoes = [...new Set(produtos.map(p => p.colecao))].filter(Boolean);
                const valorAtual = select.value;

                // Mantém a opção "Todas"
                select.innerHTML = '<option value="">-- Todas as coleções --</option>';
                colecoes.sort().forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c;
                    opt.textContent = c;
                    select.appendChild(opt);
                });

                // Restaura o valor selecionado se ainda existir
                if (valorAtual && colecoes.includes(valorAtual)) {
                    select.value = valorAtual;
                }
            }

            function renderVitrine() {
                const produtos = getProdutos();
                // Filtra apenas produtos disponíveis (disponivel !== false)
                const disponiveis = produtos.filter(p => p.disponivel !== false);
                const filtro = document.getElementById('filtro-colecao').value;
                let filtrados = disponiveis;

                if (filtro) {
                    filtrados = disponiveis.filter(p => p.colecao === filtro);
                }

                const container = document.getElementById('vitrine');
                const semMsg = document.getElementById('sem-produtos');

                // Atualiza as opções do filtro com base nos produtos disponíveis
                popularFiltro(disponiveis);

                if (filtrados.length === 0) {
                    container.innerHTML = '';
                    semMsg.style.display = 'block';
                    semMsg.textContent = filtro ? 'Nenhum produto disponível para esta coleção.' : 'Nenhum produto cadastrado ainda.';
                    return;
                }
                semMsg.style.display = 'none';

                container.innerHTML = filtrados.map(p => {
                    const imgUrl = getDriveImageUrl(p.linkFoto);
                    return `
                        <div class="vitrine-card">
                            <div class="foto">
                                ${imgUrl ? `<img src="${imgUrl}" alt="${p.codigo}" loading="lazy" onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\\'color:#999;\\'>⚠️ Imagem indisponível</span>';">` : '<span style="color:#999;">Sem imagem</span>'}
                            </div>
                            <div class="info">
                                <span class="codigo">${p.codigo}</span>
                                <span class="colecao">${p.colecao}</span>
                                <div class="preco">${formatMoney(p.precoFinal)}</div>
                                <div style="font-size:13px;color:#555;">
                                    <strong>Valor original:</strong> ${formatMoney(p.valorPeca)}
                                </div>
                                ${p.fornecedorNome ? `<div class="fornecedor">
                                    <span><strong>Fornecedor:</strong> ${p.fornecedorNome}</span>
                                    ${p.fornecedorSocial ? `<span><strong>Rede Social:</strong> ${p.fornecedorSocial}</span>` : ''}
                                    ${p.fornecedorTelefone ? `<span><strong>Telefone:</strong> ${p.fornecedorTelefone}</span>` : ''}
                                </div>` : ''}
                                <div class="link-foto">
                                    <a href="${p.linkFoto}" target="_blank" style="color:#3498db;text-decoration:none;">📎 Ver foto no Drive</a>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // Evento de mudança no filtro
            document.getElementById('filtro-colecao').addEventListener('change', renderVitrine);

            // Atualiza a vitrine quando houver mudança no localStorage (outra aba)
            window.addEventListener('storage', function (e) {
                if (e.key === STORAGE_KEY_PRODUTOS) {
                    renderVitrine();
                }
            });

            // Renderização inicial
            renderVitrine();
        })();
    </script>
</body>

</html>
